appId: com.ccdeck.app
productName: CC Deck
directories:
  buildResources: resources
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
  # Skip rcedit/signing so builds succeed without admin rights or Developer Mode
  # (electron-builder's winCodeSign bundle contains macOS symlinks that Windows
  # cannot create without elevation). Re-enable if you add a code-signing cert.
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
